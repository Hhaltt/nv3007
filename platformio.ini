[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; PNGdec default line buffer supports only 320px width.
; Dashboard is 428px wide: two 4-byte-per-pixel scanlines + filter bytes.
build_flags =
    -DPNG_MAX_BUFFERED_PIXELS=3426

monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    bitbank2/PNGdec
